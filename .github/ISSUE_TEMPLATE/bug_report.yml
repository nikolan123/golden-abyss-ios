name: Bug report
description: Something in Golden Abyss for iOS doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The app writes its own log to `Documents/Nativ/session.log` — in the Files app under
        **Golden Abyss**, then **Nativ** — and it is the first thing anyone will read, so please attach it.
        Please don't attach game files, firmware, saves or licences.
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15 Pro Max, iOS 18.2
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The ipa's name, and the commit it was built from if you know it.
      placeholder: GoldenAbyss-unsigned.ipa, main @ 96283d5
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. The chapter or area of the game helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: What you did just before, and whether it happens every time.
  - type: textarea
    id: log
    attributes:
      label: session.log
      description: Drag `Documents/Nativ/session.log` from the Files app here. If the app never gets far enough to
        write one, paste what `idevicesyslog` (or Xcode's Devices window) printed instead, from before the launch.
        Over 25 MB, share a link.
